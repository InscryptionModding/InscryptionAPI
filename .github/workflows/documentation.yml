name: Documentation

on:
    push:
        branches:
            - main

permissions:
  contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: '10.0.x'

            - name: Restore Project
              run: dotnet restore

            - name: Install DocFX
              run: |
                  curl -LJ https://github.com/dotnet/docfx/releases/download/v2.81.0/docfx-linux-x64-v2.81.0.zip -o docfx.zip
                  unzip -d docfx/ docfx.zip
                  chmod +x docfx/docfx

            - name: Generate documentation
              run: ./docfx/docfx docs/docfx.json

            - name: Checkout gh-pages
              uses: actions/checkout@v4
              with:
                  ref: gh-pages
                  path: gh-pages

            - name: Setup gh-pages folder
              run: |
                  cd gh-pages
                  rm -rf $(ls -A | grep -v .git)
                  cp -R ../docs/_site/* .

            - name: Push update
              run: |
                  cd gh-pages
                  git config user.name github-actions
                  git config user.email github-actions@github.com
                  git add .
                  git commit -a -m "Generated from ${{ github.event.head_commit.id }}" || echo "No changes needed"
                  git push
